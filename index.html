<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Joesun Violin Viewer</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js">
</script>

<style>

html, body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#d9d9d9;
}

model-viewer{
  width:100vw;
  height:100vh;

  background:
    radial-gradient(circle at center,
    #f3f3f3 0%,
    #d8d8d8 42%,
    #bdbdbd 100%);
}

/* ===== Floating Panel ===== */

.panel{

  position:fixed;

  top:20px;
  left:20px;

  width:260px;
  max-height:90vh;

  overflow-y:auto;

  background:rgba(255,255,255,0.94);

  padding:16px;

  border-radius:16px;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.18);

  z-index:30;

  transition:all .25s ease;
}

.panel.collapsed{
  width:52px;
  height:52px;
  padding:0;
  overflow:hidden;
}

.toggle-btn{

  position:absolute;

  top:8px;
  right:8px;

  width:36px;
  height:36px;

  border:none;
  border-radius:10px;

  background:#222;
  color:white;

  cursor:pointer;

  font-size:16px;
}

.panel.collapsed .panel-content{
  display:none;
}

.panel button.action{

  display:block;
  width:100%;

  margin:7px 0;
  padding:10px;

  border:none;
  border-radius:10px;

  background:#444;
  color:white;

  cursor:pointer;

  transition:all .2s ease;
}

.panel button.action:hover{
  background:#666;
  transform:scale(1.02);
}

.panel label{

  display:block;

  margin-top:14px;

  font-size:12px;
  font-weight:bold;
}

.panel input[type="range"]{
  width:100%;
}

/* ===== Company Info ===== */

.company-info{

  position:fixed;

  bottom:22px;
  left:28px;

  padding:12px 18px;

  border-radius:14px;

  background:rgba(255,255,255,0.58);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  border:1px solid rgba(255,255,255,0.35);

  font-size:14px;
  font-weight:600;

  line-height:1.5;

  color:#222;

  text-align:left;

  box-shadow:
    0 6px 24px rgba(0,0,0,0.12);

  z-index:20;
}

/* ===== AR Button ===== */

#custom-ar-btn{

  position:absolute;

  bottom:18px;
  right:18px;

  padding:12px 18px;

  border:none;
  border-radius:14px;

  background:rgba(25,25,25,0.78);

  color:white;

  font-size:14px;
  font-weight:600;

  backdrop-filter:blur(8px);

  box-shadow:
    0 6px 18px rgba(0,0,0,0.22);

  cursor:pointer;

  transition:all .2s ease;
}

#custom-ar-btn:hover{

  transform:scale(1.05);

  background:rgba(55,55,55,0.92);
}

</style>
</head>

<body>

<!-- ===== Control Panel ===== -->

<div class="panel collapsed" id="controlPanel">

  <button class="toggle-btn" onclick="togglePanel()">☰</button>

  <div class="panel-content">

    <strong>Color Style</strong>

    <button class="action" onclick="setTeslaGray()">
      Tesla Gray
    </button>

    <button class="action" onclick="setSilver()">
      Bright Silver
    </button>

    <button class="action" onclick="setMatteGray()">
      Matte Gray
    </button>

    <button class="action" onclick="setDarkGray()">
      Dark Metallic
    </button>

    <label>
      Exposure
      <span id="brightnessValue">1.35</span>
    </label>

    <input
      type="range"
      id="brightnessSlider"
      min="0.5"
      max="2.5"
      step="0.05"
      value="1.35">

    <label>
      Metallic
      <span id="metallicValue">0.82</span>
    </label>

    <input
      type="range"
      id="metallicSlider"
      min="0"
      max="1"
      step="0.01"
      value="0.82">

    <label>
      Roughness
      <span id="roughnessValue">0.24</span>
    </label>

    <input
      type="range"
      id="roughnessSlider"
      min="0"
      max="1"
      step="0.01"
      value="0.24">

  </div>

</div>

<!-- ===== Model Viewer ===== -->

<model-viewer

  id="mv"

  src="Violin-v1.glb"

  poster="poster.webp"

  ar
  ar-modes="webxr scene-viewer quick-look"

  ar-scale="fixed"
  ar-placement="floor"

  camera-controls

  auto-rotate
  autoplay

  rotation-per-second="12deg"

  environment-image="https://modelviewer.dev/shared-assets/environments/spruit_sunrise_1k_HDR.hdr"

  tone-mapping="aces"

  exposure="1.35"

  shadow-intensity="0.55"
  shadow-softness="0.9"

  camera-orbit="auto auto auto"

  field-of-view="auto">

  <!-- ===== AR Button ===== -->

  <button slot="ar-button" id="custom-ar-btn">
    📱 AR 實境預覽
  </button>

</model-viewer>

<!-- ===== Original Company Info ===== -->

<div class="company-info">

  請徐先生 確認,謝謝! 5/25 <br>

  Joesun Studio<br>

</div>

<script>

const mv = document.querySelector("#mv");

/* ===== Initial Tesla Gray ===== */

mv.addEventListener("load", () => {

  setTeslaGray();

});

/* ===== Panel Toggle ===== */

function togglePanel(){

  document
    .querySelector("#controlPanel")
    .classList.toggle("collapsed");
}

/* ===== Utility ===== */

function updateMaterial(color, metallic, roughness){

  mv.model.materials.forEach(mat => {

    const pbr = mat.pbrMetallicRoughness;

    pbr.setBaseColorFactor(color);

    pbr.setMetallicFactor(metallic);

    pbr.setRoughnessFactor(roughness);

  });

  metallicSlider.value = metallic;
  roughnessSlider.value = roughness;

  metallicValue.textContent =
    metallic.toFixed(2);

  roughnessValue.textContent =
    roughness.toFixed(2);
}

/* ===== Tesla Gray ===== */

function setTeslaGray(){

  updateMaterial(
    [0.42,0.43,0.46,1],
    0.82,
    0.24
  );
}

/* ===== Bright Silver ===== */

function setSilver(){

  updateMaterial(
    [0.72,0.72,0.74,1],
    0.92,
    0.16
  );
}

/* ===== Matte Gray ===== */

function setMatteGray(){

  updateMaterial(
    [0.45,0.45,0.46,1],
    0.35,
    0.62
  );
}

/* ===== Dark Metallic ===== */

function setDarkGray(){

  updateMaterial(
    [0.22,0.23,0.25,1],
    0.90,
    0.28
  );
}

/* ===== Exposure Slider ===== */

brightnessSlider.addEventListener("input", e => {

  const val = Number(e.target.value);

  mv.exposure = val;

  brightnessValue.textContent =
    val.toFixed(2);

});

/* ===== Metallic Slider ===== */

metallicSlider.addEventListener("input", e => {

  const val = Number(e.target.value);

  mv.model.materials.forEach(mat => {

    mat.pbrMetallicRoughness
      .setMetallicFactor(val);

  });

  metallicValue.textContent =
    val.toFixed(2);

});

/* ===== Roughness Slider ===== */

roughnessSlider.addEventListener("input", e => {

  const val = Number(e.target.value);

  mv.model.materials.forEach(mat => {

    mat.pbrMetallicRoughness
      .setRoughnessFactor(val);

  });

  roughnessValue.textContent =
    val.toFixed(2);

});

</script>

</body>
</html>
